name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: layout check (required files, no public grade, results regenerate)
        run: python tests/test_smoke.py
      - name: learn memory tests
        run: python tests/test_learn_memory.py
      - name: build memory tests
        run: python tests/test_build_memory.py
      - name: deep memory tests
        run: python tests/test_deep_memory.py
      - name: ablation tests
        run: python tests/test_ablations.py
      - name: results reproduced from the code
        run: python src/make_results.py --check
      - name: runners are deterministic and match the committed results
        run: |
          for r in learn build ablations deep; do python src/run_$r.py; done
          git diff --exit-code results/
