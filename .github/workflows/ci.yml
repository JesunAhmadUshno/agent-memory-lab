name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: learn memory tests
        run: python tests/test_learn_memory.py
      - name: learn runner determinism
        run: |
          python level-1-learn/run_learn.py
          cp level-1-learn/results_learn.json /tmp/r1.json
          python level-1-learn/run_learn.py
          diff /tmp/r1.json level-1-learn/results_learn.json
      - name: build memory tests
        run: python tests/test_build_memory.py
      - name: build runner determinism
        run: |
          python level-2-build/run_build.py
          cp level-2-build/results_build.json /tmp/r2.json
          python level-2-build/run_build.py
          diff /tmp/r2.json level-2-build/results_build.json
      - name: deep memory tests
        run: python tests/test_deep_memory.py
      - name: deep runner determinism
        run: |
          python level-3-deep/run_deep.py
          cp level-3-deep/results_deep.json /tmp/r3.json
          python level-3-deep/run_deep.py
          diff /tmp/r3.json level-3-deep/results_deep.json
